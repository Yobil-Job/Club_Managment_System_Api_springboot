version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-club_management}
      POSTGRES_USER: ${POSTGRES_USER:-club_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-club_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-club_user} -d ${POSTGRES_DB:-club_management}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: always
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-club_management}
      DB_USERNAME: ${POSTGRES_USER:-club_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-club_password}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      SCALAR_ENABLED: ${SCALAR_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
