spring.application.name=club_managment_api

# Default profile uses H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

logging.level.org.springframework=${LOG_LEVEL:info}

# CORS allowed origins (comma-separated)
cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# JWT Configuration (use environment variables in production)
jwt.secret=${JWT_SECRET:8fj39fj93fj93fj93fj93fj93fj93fj93fj93fj93fj93fj9}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.info.title=Club Management API
springdoc.info.version=1.0.0
springdoc.info.description=API for managing student clubs, events, announcements and fees
springdoc.info.contact.name=Eyob Weldetensay
springdoc.info.contact.email=eyobwldetensay@gmail.com
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.scalar.enabled=${SCALAR_ENABLED:true}
springdoc.scalar.path=/scalar
